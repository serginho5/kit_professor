# Login do Google dos apps no mesmo domínio: cada app manda a própria apiKey do Firebase
# (no endereço do /__/auth/handler ou, nos arquivos que ele carrega, no Referer). Sem ela, vai para o Dieta Fácil.
map "$arg_apiKey $http_referer" $firebase_auth {
    "~AIzaSyBFzqjySXqNT7E6Y1MVmfIhMQE1Zmy_pkc" qchef-app.firebaseapp.com;
    default dieta-facil-3c5d3.firebaseapp.com;
}

server {
    listen 80;
    server_name www.appnovidades.com.br;
    return 301 https://appnovidades.com.br$request_uri;
}

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # Login do Google (Dieta Fácil e QChef): o Firebase Auth precisa rodar no mesmo domínio do app,
    # senão o navegador bloqueia o redirect e o app instalado fica em loop na tela de login.
    # ^~ para a regra de cache de .js abaixo não capturar /__/auth/handler.js
    location ^~ /__/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://$firebase_auth;
        proxy_set_header Host $firebase_auth;
        proxy_ssl_server_name on;
        proxy_ssl_name $firebase_auth;
    }

    # Arquivos dos PWAs (Dieta Fácil e QChef) que não podem ficar em cache, senão o app instalado não se atualiza
    location ~ ^/(dietafacil|qchef)/(sw\.js|registerSW\.js|index\.html|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
