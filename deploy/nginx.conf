server {
    listen 80;
    server_name www.appnovidades.com.br;
    return 301 https://appnovidades.com.br$request_uri;
}

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # Login do Google do Dieta Fácil: o Firebase Auth precisa rodar no mesmo domínio do app,
    # senão o navegador bloqueia o redirect e o app instalado fica em loop na tela de login.
    # ^~ para a regra de cache de .js abaixo não capturar /__/auth/handler.js
    location ^~ /__/ {
        proxy_pass https://dieta-facil-3c5d3.firebaseapp.com;
        proxy_set_header Host dieta-facil-3c5d3.firebaseapp.com;
        proxy_ssl_server_name on;
    }

    # Arquivos do PWA do Dieta Fácil que não podem ficar em cache, senão o app instalado não se atualiza
    location ~ ^/dietafacil/(sw\.js|registerSW\.js|index\.html|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
